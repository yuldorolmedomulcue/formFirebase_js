<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario firebase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Formulario Firebase</h1>

    <form action="" id="formulario">

        <h2>Formulario de Registro</h2>
        <div class="form-group">
            <label for="name">Nombre: </label>
            <input type="text" id="name" name="name">

            <div class="error-mensaje" id="nameError"></div>
        </div>

        <div class="form-group">
            <label for="email">Email: </label>
            <input type="text" id="email" name="email" autocomplete="username">

            <div class="error-mensaje" id="emailError"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña: </label>
            <input type="password" id="password" name="password" autocomplete="current-password">

            <div class="error-mensaje" id="passwordError"></div>
        </div>

        <button type="submit">Enviar</button>
    </form>
    
    <!-- Primero carga Firebase -->
    <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore-compat.js"></script>

    <!-- Luego carga tu script -->
    <script src="script.js"></script>
</body>
</html>
